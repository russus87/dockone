<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b8fe8"/>
      <stop offset="1" stop-color="#0a5bd6"/>
    </linearGradient>
    <linearGradient id="cube" x1="128" y1="120" x2="384" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe6ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- stacked container blocks -->
  <g transform="translate(256 262)">
    <!-- top block -->
    <rect x="-58" y="-118" width="116" height="70" rx="12" fill="url(#cube)"/>
    <!-- middle-left -->
    <rect x="-128" y="-36" width="116" height="70" rx="12" fill="#eaf4ff"/>
    <!-- middle-right -->
    <rect x="12" y="-36" width="116" height="70" rx="12" fill="#eaf4ff"/>
    <!-- bottom center -->
    <rect x="-58" y="46" width="116" height="70" rx="12" fill="url(#cube)"/>
  </g>
  <!-- unifying dot: the "One" -->
  <circle cx="256" cy="262" r="26" fill="#0a5bd6" stroke="#ffffff" stroke-width="10"/>
</svg>
